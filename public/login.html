<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Transport Fare System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🚍 Transport Fare Management System</h1>
    <p>Admin Login</p>
  </header>

  <main>
    <section class="form-section" style="max-width: 400px; margin: 3rem auto;">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required style="grid-column: span 2;">
        <input type="password" id="password" placeholder="Password" required style="grid-column: span 2;">
        <button type="submit">Login</button>
      </form>
      <p id="errorMsg" style="color: red; margin-top: 1rem; display: none;"></p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
