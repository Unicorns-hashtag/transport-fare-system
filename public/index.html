<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transport Fare Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🚍 Transport Fare Management System</h1>
    <p>Admin Dashboard</p>
    <button id="logoutBtn" style="margin-top:0.5rem; padding:0.4rem 1rem; background:#dc2626; color:white; border:none; border-radius:4px; cursor:pointer;">Logout</button>
</header>

  <main>
    <!-- Form to add a new route -->
    <section class="form-section">
      <h2>Add New Route</h2>
      <form id="routeForm">
        <input type="text" id="origin" placeholder="Origin (e.g. Ilaro)" required>
        <input type="text" id="destination" placeholder="Destination (e.g. Lagos)" required>
        <select id="vehicleType" required>
          <option value="Bus">Bus</option>
          <option value="Taxi">Taxi</option>
          <option value="Keke">Keke</option>
          <option value="Danfo">Danfo</option>
        </select>
        <input type="number" id="fareAmount" placeholder="Fare Amount (₦)" required min="0">
        <input type="number" id="distanceKm" placeholder="Distance (km) - optional">
        <button type="submit">Add Route</button>
      </form>
    </section>

    <!-- Table showing all routes -->
    <section class="table-section">
      <h2>All Routes</h2>
      <table id="routesTable">
        <thead>
          <tr>
            <th>Origin</th>
            <th>Destination</th>
            <th>Vehicle</th>
            <th>Fare (₦)</th>
            <th>Distance (km)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="routesTableBody">
          <!-- Rows added here by JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
