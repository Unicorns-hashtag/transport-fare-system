<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Transport Fare System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-layout">

    <div id="nav-container"></div>

    <main class="page-content">
        <h1>Settings</h1>
        <p style="margin-bottom: 1.5rem; color: #666;">Manage your account</p>

        <section class="form-section" style="max-width: 500px;">
            <h2>Change Password</h2>
            <form id="passwordForm">
                <input type="password" id="currentPassword" placeholder="Current Password" required
                    style="grid-column: span 2;">
                <input type="password" id="newPassword" placeholder="New Password" required
                    style="grid-column: span 2;">
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" required
                    style="grid-column: span 2;">
                <button type="submit">Update Password</button>
            </form>
            <p id="msg" style="margin-top: 1rem; display: none;"></p>
        </section>
        <section class="form-section" style="max-width: 500px; margin-top: 1.5rem;">
            <h2>Data Backup</h2>
            <p style="color:#666; font-size:0.9rem; margin-bottom:1rem;">Download a full backup of your routes,
                vehicles, passengers, and trip records.</p>
            <button id="backupBtn"
                style="width:100%; padding:0.8rem; background:#1a5c38; color:white; border:none; border-radius:6px; cursor:pointer; font-size:0.95rem;">Download
                Backup</button>
        </section>
    </main>

    <script src="nav.js"></script>
    <script src="toast.js"></script>
    <script src="settings.js"></script>
</body>

</html>
